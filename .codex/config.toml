notify = [
  "python3",
  "/Users/josephrojo/dotfiles/.codex/notify.py"
]

model = "gpt-5.4" 
model_provider = "atlas"
model_reasoning_effort = "medium"
model_reasoning_summary = "auto"
model_verbosity = "medium"
model_supports_reasoning_summaries = true

approval_policy = "on-request"
sandbox_mode = "danger-full-access"
disable_response_storage = false
personality = "pragmatic"

[shell_environment_policy]
inherit = "all"

ignore_default_excludes = false
exclude = ["AWS_*", "AZURE_*"]
set = { }
include_only = []

[model_providers.azure]
name = "Azure OpenAI"
base_url = "https://dev-atrium-eastus2-1.openai.azure.com/openai/v1"
env_key = "AZURE_DEV_OPENAI_API_KEY"
wire_api = "responses"

[model_providers.atlas]
name = "Atlas"
base_url = "https://apis.aitrium.app.atlas.gfs-emea-ai-platform.aws.fisv.cloud/v1/codex/cat-aitrium-eastus2-1"
env_key = "AITRIUM_LLM_PASSTHROUGH"
query_params = { api-version = "2025-04-01-preview" }

[model_providers.gemini]
name = "gemini"
base_url = "https://apis.egpt.app.gemini.aws.fisv.cloud/v1/codex/cat-aitrium-eastus2-1"
env_key = "AITRIUM_GEMINI_OPENAI_API_KEY"
query_params = { api-version = "2025-04-01-preview" }

[model_providers.aitrium_gemini_reponses]
name = "Gemini Responses"
base_url = "https://apis.egpt.app.gemini.aws.fisv.cloud/v1/codex/cat-aitrium-eastus2-1"
env_key = "AITRIUM_GEMINI_OPENAI_API_KEY"
wire_api = "responses"
query_params = { api-version = "2025-04-01-preview" }

[features]
shell_snapshot = true
unified_exec = true
steer = true
personality = true
multi_agent = true
prevent_idle_sleep = true

[agents.context_retriever]
description = "Read-only repo investigator for gathering minimal context and returning compact findings with exact file references."
config_file = "agents/context-retriever.toml"
nickname_candidates = ["context", "retriever", "scout"]

[agents.codebase_understanding]
description = "Understanding-focused worker for implementation walkthroughs, flow tracing, diagrams, and reusable artifacts."
config_file = "agents/codebase-understanding.toml"
nickname_candidates = ["understand", "trace", "walkthrough"]

[agents.git_workflow]
description = "Git-focused worker for diff review, surgical staging, commit hygiene, and other scoped git operations."
config_file = "agents/git-workflow.toml"
nickname_candidates = ["git", "workflow", "committer"]

[agents.workflow_code]
description = "Code-focused worker for implementation discipline, naming, TDD, and validation."
config_file = "agents/workflow-code.toml"
nickname_candidates = ["code", "implementer", "builder"]

[agents.workflow_execution]
description = "Execution-focused worker for environment setup, tmux discipline, temp files, and command-running hygiene."
config_file = "agents/workflow-execution.toml"
nickname_candidates = ["exec", "runner", "shell"]

[agents.workflow_investigation]
description = "Investigation-focused worker for targeted search, output inspection, and tooling discipline."
config_file = "agents/workflow-investigation.toml"
nickname_candidates = ["investigate", "inspector", "search"]

[agents.workflow_testing]
description = "Testing-focused worker for verification planning, test execution, and concise result reporting."
config_file = "agents/workflow-testing.toml"
nickname_candidates = ["test", "verify", "checks"]

[agents.plan_mode_tasks]
description = "Plan-mode worker for creating and maintaining plan.md and tasks.md artifacts for approved plans."
config_file = "agents/plan-mode-tasks.toml"
nickname_candidates = ["plan", "tasks", "planner"]

[projects."/Users/josephrojo/fiserv/aitrium/labs/aitrium-conversions"]
trust_level = "trusted"

[projects."/Users/josephrojo/dotfiles"]
trust_level = "trusted"

[projects."/Users/josephrojo"]
trust_level = "trusted"

[projects."/Users/josephrojo/fiserv"]
trust_level = "trusted"

[projects."/Users/josephrojo/fiserv/ai-analytics-platform"]
trust_level = "trusted"

[projects."/Users/josephrojo/fiserv/ai-metrics"]
trust_level = "trusted"

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"
