[tools]
node = "latest"
yarn = "1.22.22"
lua = "5.1"
watchexec = "latest"
python = "latest"
pipx = "latest"
fnox = "latest"

[env]
_.file = [
  '~/.config/mise/.envars/.atlas.ms_graph.env',
  '~/.config/mise/.envars/.confluence.env',
  '~/.config/mise/.envars/.fortify.env',
  '~/.config/mise/.envars/.gitlab.env',
  '~/.config/mise/.envars/.harbor.env',
  '~/.config/mise/.envars/.local-dev.env',
  '~/.config/mise/.envars/.local-admin-api.env',
  '~/.config/mise/.envars/.secrets.env',
  '~/.config/mise/.envars/.sonatype.env',
  '~/.config/mise/.envars/.walle.env',
]
_.source = '~/.config/mise/.envars/.secrets.sh'

LOCAL_DB="postgresql://postgres:root@localhost/enterprise_gpt_api"
DB_UI_LOCAL="postgresql://postgres:root@localhost/enterprise_gpt_api"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[shell_alias]
pybritive = "REQUESTS_CA_BUNDLE=$HOME/ca_certs/zscaler_intermediate_root_ca.crt pybritive"

tcodex='''
tmux_window_create_if_missing() {
  window_name="$1"
  window_cmd="$2"
  if tmux list-windows -F '#W' | grep -Fxq "$window_name"; then
    return 0
  fi

  if [ -z "$window_cmd" ]; then
    tmux new-window -n "$window_name"
  else
    tmux new-window -n "$window_name" "zsh -lc '$window_cmd; exec zsh'"
  fi
}

tmux_window_create_if_missing "codex" "codex"
'''
