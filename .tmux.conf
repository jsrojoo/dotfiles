# unbind C-b
unbind '"'
unbind %
unbind ,
unbind M-Left
unbind M-Right
unbind M-Down
unbind M-Up
unbind c

set -g prefix C-b

set -g allow-rename off
set -g automatic-rename off
set -g base-index 1
set -g status-left-length 40
set -g status-position top
set -g status-left '(#S)'
set -g status-right ' '
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0
setw -g mouse on
setw -g pane-base-index 1

set-option -g focus-events on
set -gq allow-passthrough on
set -g visual-activity off
# for notifications
# set-option -g default-command "reattach-to-user-namespace -l zsh"

thm_surface="#fffaf3";
thm_overlay="#f2e9e1";
thm_muted="#9893a5";
thm_subtle="#797593";
thm_text="#575279";
thm_love="#b4367a";
thm_rose="#d7827e";
thm_foam="#56949f";
thm_iris="#907aa9";
thm_hl_low="#f4ede8";
thm_hl_med="#dfdad9";

thm_base="#faf4ed";
thm_pine="#286983";
thm_gold="#ea9d34";
thm_hl_high="#cecacd";

thm_bg="#eff1f5"
thm_fg="#4c4f69"
thm_cyan="#04a5e5"
thm_black="#e6e9ef"
thm_gray="#ccd0da"
thm_magenta="#8839ef"
thm_pink="#ea76cb"
thm_red="#d20f39"
thm_green="#40a02b"
thm_yellow="#df8e1d"
thm_blue="#1e66f5"
thm_orange="#fe640b"
thm_black4="#acb0be"

# set-option -g status-style "fg=$thm_pine,bg=$thm_base"
# set-option -g pane-active-border-style "fg=$thm_gold"
# set-option -g pane-border-style "fg=$thm_hl_high"
#
# setw -g window-active-style "bg=$thm_bg"
# setw -g window-style "bg=$thm_black"

set-window-option -g window-status-format '#[fg=$thm_iris]#[fg=$thm_iris] #W#{?window_zoomed_flag,*Z,} #[fg=$thm_iris]'
set-window-option -g window-status-current-format '#[fg=#2d2d2d,bg=#dddddd]#[fg=#2d2d2d,bg=#dddddd] #W#{?window_zoomed_flag,*Z,}'

bind C-b send-prefix

SWITCH_SESSION_WINDOW_FZF="tmux lsw -a -F '#S' | sort -u | column -t | fzf --reverse | xargs tmux switch-client -t"
ZMUX="zoxide query -l | fzf | sed 's/\/Users\/joseph.rojo/~/' | xargs basename | xargs -I{} bash -c 'tmux new -d -s \"{}\" -n \"\" -c '$z_dir'; tmux switch -t \"{}\"'"

bind "C-w" display-popup -E "$SWITCH_SESSION_WINDOW_FZF"
bind "r" command-prompt -I "#W" "rename-window '%%'"
bind "a" display-popup -E "$SWITCH_SESSION_WINDOW_FZF"
bind "w" display-popup -E "$SWITCH_SESSION_WINDOW_FZF"
bind "f" display-popup -E "$SWITCH_SESSION_WINDOW_FZF"
bind "c" display-popup -h '3' -w '20%' -E "~/dotfiles/scripts/python/tmux-new-window.py"

bind "b" switch-client -l
bind "C-b" switch-client -l

bind R source-file ~/.tmux.conf

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

bind  Space    copy-mode
bind  -T       copy-mode-vi  v    send  -X  begin-selection
bind  -T       copy-mode-vi  c-v  send  -X  rectangle-toggle
bind  -T       copy-mode-vi  y    send  -X  copy-selection-and-cancel
bind  -T       copy-mode-vi  j    send  -X  cursor-down
bind  -T       copy-mode-vi  k    send  -X  cursor-up
bind  -T       copy-mode-vi  l    send  -X  cursor-right
bind  -T       copy-mode-vi  u    send  -X  halfpage-up
bind  -T       copy-mode-vi  d    send  -X  halfpage-down

bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9
bind -n C-0 select-window -t 0

bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'

run -b '~/.tmux/plugins/tpm/tpm'
